<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;family=Inter:wght@400;600;700&amp;display=swap');
    </style>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="#0d1117"/>

  <!-- Subtle grid -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="80"  x2="1280" y2="80"/>
    <line x1="0" y1="160" x2="1280" y2="160"/>
    <line x1="0" y1="240" x2="1280" y2="240"/>
    <line x1="0" y1="320" x2="1280" y2="320"/>
    <line x1="0" y1="400" x2="1280" y2="400"/>
    <line x1="0" y1="480" x2="1280" y2="480"/>
    <line x1="0" y1="560" x2="1280" y2="560"/>
    <line x1="160" y1="0"  x2="160" y2="640"/>
    <line x1="320" y1="0"  x2="320" y2="640"/>
    <line x1="480" y1="0"  x2="480" y2="640"/>
    <line x1="640" y1="0"  x2="640" y2="640"/>
    <line x1="800" y1="0"  x2="800" y2="640"/>
    <line x1="960" y1="0"  x2="960" y2="640"/>
    <line x1="1120" y1="0" x2="1120" y2="640"/>
  </g>

  <!-- Accent glow top-left -->
  <ellipse cx="100" cy="100" rx="320" ry="200" fill="#3B8BD4" opacity="0.07"/>
  <!-- Accent glow bottom-right -->
  <ellipse cx="1180" cy="560" rx="280" ry="180" fill="#1D9E75" opacity="0.06"/>

  <!-- Left panel: workflow badges (decorative code) -->
  <rect x="72" y="180" width="460" height="290" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>

  <!-- Badge rows -->
  <rect x="96"  y="210" width="80"  height="22" rx="4" fill="#21262d" stroke="#30363d" stroke-width="1"/>
  <rect x="184" y="210" width="100" height="22" rx="4" fill="#1a7f37" stroke="#2ea043" stroke-width="1"/>
  <text font-family="JetBrains Mono, monospace" font-size="11" fill="#8b949e" x="100" y="225">CI</text>
  <text font-family="JetBrains Mono, monospace" font-size="11" fill="#ffffff" x="188" y="225">passing</text>

  <rect x="96"  y="244" width="120" height="22" rx="4" fill="#21262d" stroke="#30363d" stroke-width="1"/>
  <rect x="224" y="244" width="80"  height="22" rx="4" fill="#1a7f37" stroke="#2ea043" stroke-width="1"/>
  <text font-family="JetBrains Mono, monospace" font-size="11" fill="#8b949e" x="100" y="259">benchmarks</text>
  <text font-family="JetBrains Mono, monospace" font-size="11" fill="#ffffff" x="228" y="259">live</text>

  <rect x="96"  y="278" width="90"  height="22" rx="4" fill="#21262d" stroke="#30363d" stroke-width="1"/>
  <rect x="194" y="278" width="72"  height="22" rx="4" fill="#9e6a03" stroke="#d29922" stroke-width="1"/>
  <text font-family="JetBrains Mono, monospace" font-size="11" fill="#8b949e" x="100" y="293">release</text>
  <text font-family="JetBrains Mono, monospace" font-size="11" fill="#ffffff" x="198" y="293">v0.0.0</text>

  <!-- Divider -->
  <line x1="96" y1="318" x2="508" y2="318" stroke="#30363d" stroke-width="1"/>

  <!-- Commit lines (decorative) -->
  <circle cx="112" cy="344" r="5" fill="#3B8BD4"/>
  <line x1="112" y1="349" x2="112" y2="364" stroke="#30363d" stroke-width="1.5"/>
  <rect x="126" y="336" width="330" height="16" rx="3" fill="#21262d"/>
  <text font-family="JetBrains Mono, monospace" font-size="10" fill="#58a6ff" x="130" y="348">perf(parser):</text>
  <text font-family="JetBrains Mono, monospace" font-size="10" fill="#c9d1d9" x="230" y="348"> p99 320ms → 48ms</text>

  <circle cx="112" cy="372" r="5" fill="#1D9E75"/>
  <line x1="112" y1="377" x2="112" y2="392" stroke="#30363d" stroke-width="1.5"/>
  <rect x="126" y="364" width="280" height="16" rx="3" fill="#21262d"/>
  <text font-family="JetBrains Mono, monospace" font-size="10" fill="#7ee787" x="130" y="376">feat(pipeline):</text>
  <text font-family="JetBrains Mono, monospace" font-size="10" fill="#c9d1d9" x="238" y="376"> +45% throughput</text>

  <circle cx="112" cy="400" r="5" fill="#EF9F27"/>
  <line x1="112" y1="405" x2="112" y2="420" stroke="#30363d" stroke-width="1.5"/>
  <rect x="126" y="392" width="260" height="16" rx="3" fill="#21262d"/>
  <text font-family="JetBrains Mono, monospace" font-size="10" fill="#e3b341" x="130" y="404">fix(memory):</text>
  <text font-family="JetBrains Mono, monospace" font-size="10" fill="#c9d1d9" x="218" y="404"> RSS stable 312MB</text>

  <circle cx="112" cy="428" r="5" fill="#8b949e"/>
  <rect x="126" y="420" width="200" height="16" rx="3" fill="#21262d"/>
  <text font-family="JetBrains Mono, monospace" font-size="10" fill="#c9d1d9" x="130" y="432">chore: bump deps</text>

  <!-- Right panel: main title area -->
  <!-- Eyebrow -->
  <rect x="590" y="190" width="170" height="26" rx="5" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <circle cx="608" cy="203" r="5" fill="#1D9E75"/>
  <text font-family="JetBrains Mono, monospace" font-size="11" fill="#8b949e" x="620" y="208">github template</text>

  <!-- Main title -->
  <text font-family="Inter, sans-serif" font-weight="700" font-size="64" fill="#f0f6fc" x="590" y="300">Your Project</text>
  <text font-family="Inter, sans-serif" font-weight="700" font-size="64" fill="#3B8BD4" x="590" y="372">Name Here</text>

  <!-- Subtitle -->
  <text font-family="Inter, sans-serif" font-weight="400" font-size="20" fill="#8b949e" x="590" y="416">Short description of what this project does.</text>

  <!-- Feature pills -->
  <rect x="590" y="450" width="130" height="30" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text font-family="Inter, sans-serif" font-size="13" fill="#7ee787" x="610" y="470">✓ commitlint</text>

  <rect x="732" y="450" width="130" height="30" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text font-family="Inter, sans-serif" font-size="13" fill="#58a6ff" x="752" y="470">✓ benchmarks</text>

  <rect x="874" y="450" width="118" height="30" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text font-family="Inter, sans-serif" font-size="13" fill="#e3b341" x="894" y="470">✓ changelog</text>

  <rect x="1004" y="450" width="118" height="30" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text font-family="Inter, sans-serif" font-size="13" fill="#ffa198" x="1024" y="470">✓ PR rules</text>

  <!-- Bottom bar -->
  <line x1="72" y1="560" x2="1208" y2="560" stroke="#30363d" stroke-width="1"/>
  <text font-family="JetBrains Mono, monospace" font-size="12" fill="#484f58" x="72"   y="590">github.com/<!-- owner -->/<!-- repo --></text>
  <text font-family="JetBrains Mono, monospace" font-size="12" fill="#484f58" x="1208" y="590" text-anchor="end">Use this template →</text>
</svg>
